[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banxico-series-pipeline"
version = "1.0.0"
description = "Automated ETL Pipeline and Econometric Time-Series Engine for Mexican Macro Indicators (Banxico SIE)"
readme = "README.md"
authors = [{ name = "Miguel Delgado Huitron", email = "ianhuitron0687@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
banxico-etl = "banxico_etl.cli:main"

[tool.setuptools.packages.find]
include = ["banxico_etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
